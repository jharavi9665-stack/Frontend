<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admission Enquiry – School ERP</title>
  <link rel="icon" type="image/png" href="../../assets/images/front-office/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Base layout (sidebar, topbar, workspace) -->
  <link rel="stylesheet" href="../../css/dashboard/dashboard.css">
  <!-- Shared Front Office styles (modal, form grid, table helpers) -->
  <link rel="stylesheet" href="../../css/front-office/front-office.css">
</head>
<body>
<div class="app-shell">

  <!-- ===== SIDEBAR (populated by sidebar-template.js) ===== -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- ===== WORKSPACE ===== -->
  <section class="workspace">

    <!-- TOPBAR -->
    <header class="topbar">
      <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
          <path d="M1 1h16M1 7h16M1 13h16" stroke="#56647b" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="header-brand" onclick="window.location.href='../../pages/dashboard/index.html'" style="cursor:pointer;">
        <div class="hb-logo-box">
          <img src="../../assets/images/branding/school-logo.png" alt="School Logo" class="hb-logo-img">
        </div>
        <div class="hb-text">
          <span class="hb-name">Devryon</span>
          <span class="hb-sub">Demo School</span>
        </div>
      </div>
      <div class="header-search">
        <svg class="search-svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="6.5" cy="6.5" r="5" stroke="#9ba8bc" stroke-width="1.6"/>
          <path d="M10.5 10.5L14 14" stroke="#9ba8bc" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input type="search" placeholder="Search students, staff, fees...">
      </div>
      <div class="top-actions">
        <div class="user-profile">
          <div class="user-avatar-wrap">
            <img class="user-avatar" src="../../assets/images/auth/login-hero.jpg" alt="Admin">
            <span class="user-online-dot"></span>
          </div>
          <div class="user-info">
            <span class="user-name">Raj Yadav</span>
            <span class="user-role">Administrator</span>
          </div>
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="page">

      <!-- ==========================================
         SELECT CRITERIA
      ========================================== -->
      <section class="criteria">
        <div class="criteria-header">
          <div class="section-title-wrap">
            <span class="orange-accent-bar"></span>
            <span class="section-title-text">Select Criteria</span>
          </div>
        </div>
        <div class="criteria-grid-wrap">
          <div class="filter-grid">
            <div class="field">
              <label>Class</label>
              <div class="input-icon-group">
                <svg class="field-ico" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                <select id="filterClass">
                  <option>Select Class</option>
                  <option>Class 1</option>
                  <option>Class 2</option>
                  <option>Class 3</option>
                  <option>Class 4</option>
                  <option>Class 5</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label>Source</label>
              <div class="input-icon-group">
                <svg class="field-ico" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                <select id="filterSource">
                  <option>Select Source</option>
                  <option>Notice Board</option>
                  <option>via friend</option>
                  <option>Newspaper</option>
                  <option>Website</option>
                  <option>Walk In</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label>Enquiry From Date *</label>
              <div class="input-icon-group">
                <svg class="field-ico" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <input type="date" id="filterFromDate">
              </div>
            </div>
            <div class="field">
              <label>Enquiry To Date *</label>
              <div class="input-icon-group">
                <svg class="field-ico" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <input type="date" id="filterToDate">
              </div>
            </div>
            <div class="field">
              <label>Status</label>
              <select id="filterStatus" class="status-select">
                <option>● Active</option>
                <option>All Status</option>
                <option>Pending</option>
                <option>Closed</option>
              </select>
            </div>
          </div>
          <div class="criteria-right-col">
            <button id="btnSearchCriteria" class="field-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              Search
            </button>
            <div id="btnResetFilters" class="reset">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
              Reset Filters
            </div>
          </div>
        </div>
      </section>

      <!-- ==========================================
         ADMISSION ENQUIRY TABLE
      ========================================== -->
      <section class="list-card">
        <div class="card-heading">
          <div class="section-title-wrap">
            <span class="orange-accent-bar"></span>
            <span class="section-title-text">Admission Enquiry</span>
          </div>
          <button class="btn primary" id="openAddModal">+ Add Enquiry</button>
        </div>

        <div class="table-tools">
          <div class="search-input-wrap">
            <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="tableSearchInput" placeholder="Search by name, phone or source...">
          </div>
          <div class="tool-actions">
            <select><option>50</option></select>
            <span class="per-page-text">per page</span>
            <div class="export-icon-group">
              <button class="export" title="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>
              <button class="export" title="Export Excel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg></button>
              <button class="export" title="Export CSV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></button>
              <button class="export" title="Export PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M10 12h4"/><path d="M10 16h4"/></svg></button>
              <button class="export" title="Print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
              <button class="export" title="Columns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/><path d="M18 9l3 3-3 3"/></svg></button>
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name <span class="sort-icon">↕</span></th>
                <th>Phone <span class="sort-icon">↕</span></th>
                <th>Source <span class="sort-icon">↕</span></th>
                <th>Enquiry Date <span class="sort-icon">↕</span></th>
                <th>Last Follow Up <span class="sort-icon">↕</span></th>
                <th>Next Follow Up <span class="sort-icon">↕</span></th>
                <th>Status <span class="sort-icon">↕</span></th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <!-- Populated by admission.js -->
            </tbody>
          </table>
        </div>

        <div class="pager">
          <span>Showing 0 entries</span>
          <div class="pages">
            <button class="page-nav">‹</button>
            <button class="current">1</button>
            <button class="page-nav">›</button>
          </div>
        </div>
      </section>

    </main>
  </section>
</div>

<!-- ==========================================
   ADD / EDIT ENQUIRY MODAL
========================================== -->
<div class="modal" id="addModal" aria-hidden="true">
  <div class="modal-card" style="width:min(900px,95vw);">
    <div class="modal-head">
      <div>
        <span class="modal-icon">✦</span>
        <span>
          <strong id="admissionModalTitle">Add Admission Enquiry</strong>
          <small>Fill in enquiry details below</small>
        </span>
      </div>
      <button class="modal-close" id="closeAdmissionModal" aria-label="Close">×</button>
    </div>
    <form id="admissionForm">
      <div class="modal-body">
        <div class="fo-form-grid">
          <div class="fo-form-field">
            <label>Student Name *</label>
            <input type="text" id="studentName" placeholder="Enter Student Name" required>
          </div>
          <div class="fo-form-field">
            <label>Phone Number *</label>
            <input type="tel" id="phoneNumber" placeholder="Enter Phone Number" required>
          </div>
          <div class="fo-form-field">
            <label>Email Address</label>
            <input type="email" id="emailAddress" placeholder="Enter Email">
          </div>
          <div class="fo-form-field">
            <label>Class</label>
            <select id="studentClass">
              <option>Select Class</option>
              <option>Class 1</option>
              <option>Class 2</option>
              <option>Class 3</option>
              <option>Class 4</option>
              <option>Class 5</option>
            </select>
          </div>
          <div class="fo-form-field">
            <label>Purpose</label>
            <select id="purpose">
              <option>Select Purpose</option>
              <option>Admission</option>
              <option>Scholarship</option>
              <option>Transport</option>
              <option>Hostel</option>
              <option>General Inquiry</option>
            </select>
          </div>
          <div class="fo-form-field">
            <label>Source *</label>
            <select id="source" required>
              <option>Select Source</option>
              <option>Notice Board</option>
              <option>via friend</option>
              <option>Newspaper</option>
              <option>Website</option>
              <option>Walk In</option>
              <option>Reference</option>
            </select>
          </div>
          <div class="fo-form-field">
            <label>Reference</label>
            <input type="text" id="reference" placeholder="Reference Name">
          </div>
          <div class="fo-form-field">
            <label>Enquiry Date</label>
            <input type="date" id="enquiryDate">
          </div>
          <div class="fo-form-field">
            <label>Next Follow Up Date</label>
            <input type="date" id="nextFollowUpDate">
          </div>
          <div class="fo-form-field">
            <label>Status</label>
            <select id="status">
              <option>Active</option>
              <option>Pending</option>
              <option>Closed</option>
            </select>
          </div>
          <div class="fo-form-field wide">
            <label>Address</label>
            <textarea id="address" rows="3" placeholder="Enter Address"></textarea>
          </div>
          <div class="fo-form-field wide">
            <label>Description</label>
            <textarea id="description" rows="3" placeholder="Enter Description"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn ghost" id="cancelAdmissionModal">Cancel</button>
        <button type="submit" class="btn primary" id="admissionSubmitBtn">▣ &nbsp;Save Enquiry&nbsp;→</button>
      </div>
    </form>
  </div>
</div>

<!-- Scripts -->
<script src="../../js/common/storage-utils.js"></script>
<script src="../../js/common/export-utils.js"></script>
<script src="../../js/front-office/sidebar-template.js"></script>
<script src="../../js/front-office/front-office.js"></script>
<script src="../../js/front-office/admission.js"></script>
</body>
</html>
